<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dog Adoption Agency</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Find Your Furry Friend!</h1>
      <p>We are the best Agency.</p>
    </header>
    <br />
    <main>
      <section>
        <h2>About Us.</h2>
        <p>Our mission is to find a great home for every dog.</p>
      </section>
      <br />
      <section>
        <h2>Why Adopt From Us?</h2>
        <ul>
          <li>because</li>
          <li>we</li>
          <li>are</li>
          <li>the</li>
          <li>best</li>
        </ul>
      </section>
      <br />
      <section>
        <h2>Meet Our Dogs.</h2>
        <figure><img src="https://placedog.net/501/280" alt="Dog1" /></figure>
        <figure><img src="https://placedog.net/502/280" alt="Dog2" /></figure>
        <figure><img src="https://placedog.net/503/280" alt="Dog3" /></figure>
        <figure><img src="https://placedog.net/504/280" alt="Dog4" /></figure>
        <figure><img src="https://placedog.net/505/280" alt="Dog5" /></figure>
      </section>
    </main>
    <br />
    <section>
      <h2>Get in Touch.</h2>
      <form action="">
        <fieldset>
          <legend><h3>Contact Form</h3></legend>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" /><br /><br />
          <label for="email">Email:</label>
          <input type="text" id="email" name="email" /><br /><br />
          <label for="message">Message:</label>
          <textarea id="message" name="message"></textarea><br /><br />
          <button type="submit">Submit</button>
        </fieldset>
      </form>
      <br />
    </section>
    <footer><p>© 2024 Dog Adoption Agency.</p></footer>
  </body>
</html>
